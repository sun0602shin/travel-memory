<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f4ee"><title>여행의 조각들 · Trip Memo v2</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Pretendard','Noto Sans KR',sans-serif;color:#252e2c;background:#f7f4ee}*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.app{max-width:800px;margin:auto;padding:0 18px 105px}header{position:sticky;top:0;z-index:5;background:#f7f4eeeb;backdrop-filter:blur(13px);padding:18px 0 13px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #e8e5dc}.brand{font-family:Georgia,serif;font-size:24px;letter-spacing:-1px}.brand small{display:block;font:10px sans-serif;letter-spacing:3px;color:#879188;margin-top:2px}.pill{border:1px solid #d9ded6;border-radius:99px;padding:9px 13px;background:#fff;color:#375951;font-size:12px}.hero{padding:32px 0 19px}.eyebrow{font-size:11px;letter-spacing:2.3px;font-weight:700;color:#708478}.hero h1{font-family:Georgia,'Noto Serif KR',serif;font-size:33px;letter-spacing:-1.5px;line-height:1.3;margin:12px 0}.muted{color:#839089;font-size:13px;line-height:1.6}.primary{background:#2e6254;color:#fff;border:0;border-radius:13px;padding:12px 16px;font-weight:700}.secondary{background:#fff;border:1px solid #d9ded6;color:#2e6254;border-radius:13px;padding:11px 14px}.ghost{border:0;background:transparent;color:#457263;padding:8px}.card{background:#fff;border:1px solid #e8e9e3;border-radius:22px;padding:19px;margin:13px 0;box-shadow:0 4px 22px #1c493308}.trip{cursor:pointer;display:flex;gap:17px;align-items:center}.trip-cover{width:99px;height:102px;flex:none;object-fit:cover;border-radius:14px;background:linear-gradient(135deg,#cadbd4,#eae1ca);display:grid;place-items:center;font-size:32px}.trip-main{min-width:0;flex:1}.trip-main h3{margin:6px 0;font-size:19px}.tags{display:flex;gap:7px;flex-wrap:wrap}.tag{font-size:11px;color:#6d8178;background:#f0f4ee;border-radius:20px;padding:5px 9px}.tabs{position:sticky;top:72px;background:#f7f4ee;display:flex;gap:5px;overflow:auto;padding:12px 0;z-index:4}.tab{white-space:nowrap;border:none;background:transparent;padding:11px 13px;border-radius:12px;color:#84918c}.tab.active{background:#e1ece5;color:#28614d;font-weight:800}.section-title{display:flex;align-items:center;justify-content:space-between;gap:9px;margin:20px 0 13px}.section-title h2{font-size:21px;margin:0}.notice{font-size:12px;background:#edf4ee;border-radius:14px;padding:14px;color:#517166;line-height:1.7;margin:12px 0}.empty{text-align:center;padding:47px 20px;color:#87938a}.empty .emoji{font-size:40px;margin:0 0 12px}.day{margin:24px 0 30px}.dayhead{display:flex;align-items:center;gap:12px;margin-bottom:14px}.daynum{width:57px;height:57px;border-radius:17px;background:#dceae1;color:#2a624e;display:grid;place-items:center;font-size:13px;font-weight:800;text-align:center}.daynum b{display:block;font-size:20px}.photos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.photo{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background:#e9eae2;cursor:pointer}.photo img{width:100%;height:100%;object-fit:cover}.photo small{position:absolute;bottom:0;left:0;right:0;padding:17px 6px 6px;background:linear-gradient(transparent,#0009);color:#fff;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.form label{display:block;font-size:12px;font-weight:800;color:#61746a;margin:14px 0 5px}.form input,.form textarea,.form select{width:100%;padding:12px;border:1px solid #d9e0d8;border-radius:11px;background:#fff;color:#25392e}.form textarea{resize:vertical;min-height:80px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.actions{display:flex;gap:9px;flex-wrap:wrap;margin:16px 0}.statrow{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:#edf2ec;border-radius:14px;padding:15px 10px}.stat b{display:block;font-size:19px;margin-top:7px;overflow-wrap:anywhere}.stat small{color:#698076;font-size:11px}.expense{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid #ebeee8;padding:13px 0}.expense:last-child{border:0}.expense b{display:block}.expense small{color:#85928a}.cover{border-radius:22px;min-height:220px;background:linear-gradient(135deg,#bfd8cd,#f3e4d4);background-size:cover;background-position:center;display:flex;align-items:end;padding:22px;color:white;text-shadow:0 1px 7px #234b4a;position:relative}.cover:before{content:'';background:linear-gradient(transparent,#243a3699);position:absolute;inset:0;border-radius:22px}.cover>*{position:relative}.cover h2{font-size:30px;margin:5px 0}.quote{font:italic 22px Georgia,serif;color:#4f7567;line-height:1.5}.timeline-note{border-left:2px solid #c6dace;padding:0 0 16px 17px;margin-left:12px;white-space:pre-wrap}.modalback{position:fixed;z-index:12;inset:0;background:#1c2d2a99;display:flex;align-items:end;justify-content:center}.modal{background:#fdfcf9;width:min(800px,100%);max-height:92dvh;overflow:auto;border-radius:24px 24px 0 0;padding:22px 22px 35px}.modalhead{display:flex;align-items:center;justify-content:space-between}.modalhead h2{margin:0}.close{border:0;background:#e8eee8;border-radius:50%;width:34px;height:34px}.preview{max-width:100%;max-height:38vh;border-radius:12px;object-fit:contain;display:block;margin:10px auto}.file{display:none}.sm{font-size:12px}.danger{color:#ad5a53}.bar{height:9px;border-radius:10px;background:#e5eee7;overflow:hidden}.bar>div{height:100%;background:#478a74}.bottom{position:fixed;bottom:0;left:0;right:0;padding:13px max(16px,env(safe-area-inset-left)) calc(13px + env(safe-area-inset-bottom));background:#fbfaf5ed;backdrop-filter:blur(15px);border-top:1px solid #e2e8e1;z-index:6}.bottom>div{max-width:800px;margin:auto;display:flex;justify-content:space-between;gap:8px}.bottom button{flex:1}.hide{display:none!important}@media(min-width:750px){.photos{grid-template-columns:repeat(4,1fr)}.modalback{align-items:center}.modal{border-radius:23px;max-height:85vh}} 
</style></head><body><div class="app"><header><div class="brand" id="brand">the little journeys<small>PHOTO · PLACE · MEMORY</small></div><button class="pill" id="backupOpen">↥ 백업 / 복원</button></header><main id="app"></main></div><div id="bottom" class="bottom"></div><div id="modalRoot"></div><input class="file" id="photosFile" type="file" accept="image/*" multiple><input class="file" id="receiptFile" type="file" accept="image/*" capture="environment"><input class="file" id="backupFile" type="file" accept="application/json,.json"><script>
'use strict';
const DBNAME='tripmemo_v1';let localMode=false;const localPrefix='travel_app_fallback_';let db, trips=[], photos=[], expenses=[], notes=[], selected=null, tab='timeline';let activePhoto=null;
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const uid=()=>((typeof crypto!=='undefined'&&typeof crypto.randomUUID==='function')?crypto.randomUUID():Date.now()+'_'+Math.random());const today=()=>new Date().toLocaleDateString('sv-SE');const money=(n,c='KRW')=>new Intl.NumberFormat('ko-KR',{style:'currency',currency:c||'KRW',maximumFractionDigits:c==='KRW'?0:2}).format(Number(n)||0);const dateLabel=s=>s?new Date(s+'T12:00:00').toLocaleDateString('ko-KR',{month:'long',day:'numeric',weekday:'short'}):'';const isoLocal=t=>{let d=new Date(t);if(isNaN(d))return today();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};
function openDB(){return new Promise((resolve,reject)=>{let req=indexedDB.open(DBNAME,1);req.onupgradeneeded=()=>{for(const name of ['trips','photos','expenses','notes'])req.result.createObjectStore(name,{keyPath:'id'})};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
async function fallbackAll(name){let items=JSON.parse(localStorage.getItem(localPrefix+name)||'[]');if(name==='photos')return items.map(p=>({...p,blob:p.dataURL?dataURLBlob(p.dataURL):null}));return items}
async function fallbackPut(name,obj){let items=JSON.parse(localStorage.getItem(localPrefix+name)||'[]');let record={...obj};if(name==='photos'&&record.blob){record.dataURL=await blobDataURL(record.blob);delete record.blob}let ix=items.findIndex(x=>x.id===obj.id);if(ix>=0)items[ix]=record;else items.push(record);localStorage.setItem(localPrefix+name,JSON.stringify(items))}
async function fallbackDel(name,id){let items=JSON.parse(localStorage.getItem(localPrefix+name)||'[]').filter(x=>x.id!==id);localStorage.setItem(localPrefix+name,JSON.stringify(items))}
function txn(name,mode='readonly'){return db.transaction(name,mode).objectStore(name)}function all(name){if(localMode)return fallbackAll(name);return new Promise((res,rej)=>{let r=txn(name).getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}function put(name,obj){if(localMode)return fallbackPut(name,obj);return new Promise((res,rej)=>{let r=txn(name,'readwrite').put(obj);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}function del(name,id){if(localMode)return fallbackDel(name,id);return new Promise((res,rej)=>{let r=txn(name,'readwrite').delete(id);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}async function reload(){[trips,photos,expenses,notes]=await Promise.all(['trips','photos','expenses','notes'].map(all));render()}
const urls=new Map();function photoURL(p){if(!p?.blob)return '';if(!urls.has(p.id))urls.set(p.id,URL.createObjectURL(p.blob));return urls.get(p.id)}function clearUrl(id){if(urls.has(id)){URL.revokeObjectURL(urls.get(id));urls.delete(id)}}function trip(){return trips.find(t=>t.id===selected)}function listPhoto(){return photos.filter(p=>p.tripId===selected).sort((a,b)=>a.datetime.localeCompare(b.datetime))}function listExpenses(){return expenses.filter(e=>e.tripId===selected).sort((a,b)=>b.date.localeCompare(a.date))}function listNotes(){return notes.filter(n=>n.tripId===selected).sort((a,b)=>a.date.localeCompare(b.date))}function cover(t){const p=photos.find(p=>p.id===t.coverId)||photos.find(p=>p.tripId===t.id);return p?photoURL(p):''}
function render(){if(!selected||!trip())renderHome();else renderTrip();}
function renderHome(){selected=null;$('#app').innerHTML=`<section class="hero"><div class="eyebrow">YOUR TRAVEL JOURNAL</div><h1>여행의 순간을 모아<br>나만의 이야기를.</h1><p class="muted">사진이 일정이 되고, 영수증이 가계부가 되고,<br>모든 여행이 한 권의 추억으로 남아요.</p><button class="primary" onclick="newTrip()">＋ 새 여행 만들기</button></section><div class="section-title"><h2>나의 여행들</h2><span class="muted">${trips.length}개의 이야기</span></div>${trips.length?trips.slice().sort((a,b)=>b.start.localeCompare(a.start)).map(t=>`<article class="card trip" onclick="openTrip('${t.id}')"><div class="trip-cover" ${cover(t)?`style="background-image:url('${cover(t)}');background-size:cover;background-position:center"`:''}>${cover(t)?'':'✈️'}</div><div class="trip-main"><div class="tags"><span class="tag">${t.status==='done'?'추억 보관함':'여행 기록 중'}</span>${t.destination?`<span class="tag">${esc(t.destination)}</span>`:''}</div><h3>${esc(t.title)}</h3><div class="muted">${esc(t.start)}${t.end&&t.end!==t.start?' ~ '+esc(t.end):''}</div><div class="muted">사진 ${photos.filter(p=>p.tripId===t.id).length}장 · 지출 ${expenses.filter(e=>e.tripId===t.id).length}건</div></div><span style="color:#96a69a">›</span></article>`).join(''):`<div class="empty"><div class="emoji">🧳</div>첫 여행을 만들어 보세요.<br>당일치기도, 한 달 여행도 좋아요.</div>`}`;$('#bottom').innerHTML='';}
function openTrip(id){selected=id;tab='timeline';render()}function goHome(){selected=null;render()}function showTab(v){tab=v;render()}function renderTrip(){const t=trip(), pp=listPhoto(),ee=listExpenses(),nn=listNotes();let sum=ee.reduce((s,e)=>s+Number(e.amount||0),0);$('#app').innerHTML=`<div class="actions"><button class="ghost" onclick="goHome()">← 모든 여행</button><button class="ghost" onclick="editTrip()">여행 설정 ⚙</button></div><div class="cover" ${cover(t)?`style="background-image:url('${cover(t)}')"`:''}><div><div class="eyebrow" style="color:#fff">${t.status==='done'?'COMPLETED JOURNEY':'ONGOING JOURNEY'}</div><h2>${esc(t.title)}</h2><div>${esc(t.destination||'어디든')} · ${esc(t.start)}${t.end!==t.start?' ~ '+esc(t.end):''}</div></div></div><nav class="tabs">${[['timeline','📍 타임라인'],['photos','📸 사진'],['budget','💳 경비'],['story','📖 여행책']].map(([v,txt])=>`<button class="tab ${tab===v?'active':''}" onclick="showTab('${v}')">${txt}</button>`).join('')}</nav><div id="tabContent"></div>`;
let out='';if(tab==='timeline'){let groups={};pp.forEach(p=>(groups[p.datetime.slice(0,10)]??=[]).push(p));nn.forEach(n=>(groups[n.date]??=[]).push(n));let dates=Object.keys(groups).sort();out=`<div class="section-title"><h2>날짜별 여행 기록</h2><button class="secondary" onclick="$('#photosFile').click()">＋ 사진 올리기</button></div><p class="muted">사진의 촬영 시간으로 자동 정렬해요. 장소는 사진 GPS가 있으면 읽고, 없으면 직접 입력할 수 있어요.</p>${dates.map(d=>{let items=groups[d];let dayN=Math.round((new Date(d)-new Date(t.start))/86400000)+1;return `<section class="day"><div class="dayhead"><div class="daynum">DAY<b>${dayN>0?dayN:'·'}</b></div><div><b>${dateLabel(d)}</b><div class="muted">사진 ${items.filter(x=>x.blob).length}장 · 메모 ${items.filter(x=>!x.blob).length}개</div></div></div><div class="photos">${items.filter(x=>x.blob).map(p=>tile(p)).join('')}</div>${items.filter(x=>!x.blob).map(n=>`<div class="timeline-note" onclick="editNote('${n.id}')"><b>${esc(n.place||'오늘의 기록')}</b><div class="muted">${esc(n.text)}</div></div>`).join('')}</section>`}).join('')||`<div class="empty"><div class="emoji">📷</div>사진을 올리면 여행 날짜별로<br>자동으로 정리돼요.</div>`}<button class="secondary" onclick="newNote()">✎ 오늘의 여행 메모</button>`}
if(tab==='photos'){out=`<div class="section-title"><h2>사진 보관함</h2><button class="primary" onclick="$('#photosFile').click()">＋ 사진 추가</button></div><div class="muted">총 ${pp.length}장 · 사진을 누르면 시간·장소·메모를 수정할 수 있어요.</div><div class="photos" style="margin-top:16px">${pp.map(tile).join('')}</div>${!pp.length?'<div class="empty">아직 사진이 없어요.</div>':''}`}
if(tab==='budget'){const currency=t.currency||'KRW',budget=Number(t.budget)||0;let bycat={};ee.forEach(e=>bycat[e.category]=(bycat[e.category]||0)+Number(e.amount));out=`<div class="section-title"><h2>여행 경비</h2><button class="primary" onclick="newExpense()">＋ 지출 입력</button></div><div class="statrow"><div class="stat"><small>예산</small><b>${budget?money(budget,currency):'미설정'}</b></div><div class="stat"><small>사용</small><b>${money(sum,currency)}</b></div><div class="stat"><small>남은 예산</small><b>${budget?money(budget-sum,currency):'—'}</b></div></div>${budget?`<div class="bar" style="margin:14px 0"><div style="width:${Math.min(100,sum/budget*100)}%"></div></div>`:''}<div class="actions"><button class="secondary" onclick="$('#receiptFile').click()">📄 영수증 사진 읽기</button><button class="secondary" onclick="exportCSV()">↓ CSV 내보내기</button></div><div class="notice">영수증 읽기는 인터넷 연결이 필요하며, 인식된 가게명과 금액은 반드시 확인해주세요. 카테고리와 상세내역은 직접 편집할 수 있어요.</div><div class="card"><h3>카테고리별 지출</h3>${Object.keys(bycat).length?Object.entries(bycat).sort((a,b)=>b[1]-a[1]).map(([c,v])=>`<div class="expense"><span>${esc(c)}</span><b>${money(v,currency)}</b></div>`).join(''):'<p class="muted">아직 지출이 없어요.</p>'}</div><div class="card"><h3>지출 내역</h3>${ee.map(e=>`<div class="expense" onclick="editExpense('${e.id}')" style="cursor:pointer"><div><b>${esc(e.place||e.category)}</b><small>${esc(e.date)} · ${esc(e.category)} ${e.detail?'· '+esc(e.detail):''}</small></div><b>${money(e.amount,currency)}</b></div>`).join('')||'<div class="muted">＋ 지출 입력 또는 영수증 촬영을 눌러보세요.</div>'}</div>`}
if(tab==='story'){let locations=[...new Set(pp.map(p=>p.place).filter(Boolean))];out=`<div class="section-title"><h2>한 권의 여행책</h2><button class="secondary" onclick="editTrip()">표지·소개 수정</button></div><p class="quote">“${esc(t.intro||'머물렀던 풍경들이, 우리의 이야기가 된다.')}”</p><div class="statrow"><div class="stat"><small>사진</small><b>${pp.length}장</b></div><div class="stat"><small>기록</small><b>${nn.length}개</b></div><div class="stat"><small>방문 장소</small><b>${locations.length}곳</b></div></div><div class="card"><h3>이 여행의 이야기</h3><p class="muted">${esc(t.intro||'여행의 가장 기억에 남는 장면을 적어보세요.')}</p>${nn.map(n=>`<div class="timeline-note"><b>${dateLabel(n.date)} · ${esc(n.place)}</b><p>${esc(n.text)}</p></div>`).join('')}</div><div class="actions"><button class="primary" onclick="exportBook()">📖 여행책 HTML 저장</button><button class="secondary" onclick="toggleDone()">${t.status==='done'?'↶ 기록 중으로':'✓ 여행 완료하기'}</button></div><div class="notice">완료해도 사진과 기록은 수정할 수 있어요. 여행책은 사진이 포함된 독립 HTML로 저장되어 오래 보관하거나 PDF로 인쇄할 수 있어요.</div>`}
$('#tabContent').innerHTML=out;$('#bottom').innerHTML=selected?`<div><button class="secondary" onclick="$('#photosFile').click()">📷 사진 추가</button><button class="secondary" onclick="newExpense()">＋ 지출</button><button class="primary" onclick="newNote()">✎ 기록 남기기</button></div>`:'';}
function tile(p){return `<div class="photo" onclick="editPhoto('${p.id}')"><img loading="lazy" src="${photoURL(p)}"><small>${esc(p.place||p.datetime.slice(11,16))}</small></div>`}
function modal(title,html){$('#modalRoot').innerHTML=`<div class="modalback" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modalhead"><h2>${title}</h2><button class="close" onclick="closeModal()">✕</button></div>${html}</div></div>`}function closeModal(){$('#modalRoot').innerHTML=''}function formData(){return Object.fromEntries(new FormData($('#editor')).entries())}
function tripForm(t={}){modal(t.id?'여행 설정':'새 여행 만들기',`<form id="editor" class="form" onsubmit="saveTrip(event,'${t.id||''}')"><label>여행 제목 *</label><input name="title" required placeholder="예: 2027 뉴질랜드 남섬 로드트립" value="${esc(t.title||'')}"><label>여행 장소 / 국가</label><input name="destination" placeholder="예: 뉴질랜드 남섬" value="${esc(t.destination||'')}"><div class="grid2"><div><label>시작일 *</label><input type="date" name="start" required value="${t.start||today()}"></div><div><label>종료일 *</label><input type="date" name="end" required value="${t.end||today()}"></div></div><div class="grid2"><div><label>기본 통화</label><select name="currency">${['KRW','NZD','USD','JPY','EUR','AUD','THB'].map(c=>`<option ${t.currency===c?'selected':''}>${c}</option>`).join('')}</select></div><div><label>여행 예산</label><input name="budget" inputmode="decimal" type="number" min="0" step="0.01" value="${t.budget||''}" placeholder="선택"></div></div><label>여행 한 줄 소개</label><textarea name="intro" placeholder="이 여행에서 기억하고 싶은 것은...">${esc(t.intro||'')}</textarea><div class="actions"><button class="primary" type="submit">저장</button>${t.id?`<button type="button" class="ghost danger" onclick="deleteTrip()">이 여행 삭제</button>`:''}</div></form>`)}function newTrip(){tripForm()}function editTrip(){tripForm(trip())}async function saveTrip(ev,id){ev.preventDefault();let f=formData();if(f.end<f.start){alert('종료일이 시작일보다 빠릅니다.');return}await put('trips',{...trips.find(x=>x.id===id),...f,id:id||uid(),status:trips.find(x=>x.id===id)?.status||'active',created:Date.now()});closeModal();if(!id){let x=await all('trips');selected=x.find(t=>t.title===f.title&&t.start===f.start)?.id||null}await reload()}async function deleteTrip(){if(!confirm('여행과 사진, 지출, 메모를 모두 삭제할까요? 되돌릴 수 없습니다.'))return;for(const name of ['photos','expenses','notes'])for(const x of await all(name))if(x.tripId===selected){await del(name,x.id);if(name==='photos')clearUrl(x.id)}await del('trips',selected);selected=null;closeModal();await reload()}async function toggleDone(){let t=trip();await put('trips',{...t,status:t.status==='done'?'active':'done'});await reload()}
async function ensureExifr(){if(window.exifr)return true;try{await loadScript('https://cdn.jsdelivr.net/npm/exifr@7.1.3/dist/full.umd.js');return !!window.exifr}catch{return false}}function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s)})}
async function onPhotos(files){if(!selected||!files.length)return;let status=document.createElement('div');status.className='notice';status.textContent='사진 정보 분석 중...';$('#tabContent')?.prepend(status);const can=await ensureExifr();let count=0;for(const file of files){if(!file.type.startsWith('image/'))continue;let meta={};if(can)try{meta=await exifr.parse(file,{tiff:true,exif:true,gps:true,icc:false,xmp:false,iptc:false})||{}}catch{};let taken=meta.DateTimeOriginal||meta.CreateDate||meta.ModifyDate||file.lastModified;let d=new Date(taken);if(isNaN(d))d=new Date(file.lastModified);let dt=isoLocal(d)+'T'+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');let lat=Number.isFinite(meta.latitude)?meta.latitude:null,lon=Number.isFinite(meta.longitude)?meta.longitude:null;await put('photos',{id:uid(),tripId:selected,blob:file,filename:file.name,datetime:dt,place:'',lat,lon,caption:'',added:Date.now()});count++;status.textContent=`${count}장 저장했어요...`;}$('#photosFile').value='';await reload();alert(`${count}장의 사진을 여행에 추가했어요.${!can?' 촬영 정보 라이브러리를 불러오지 못해 파일 날짜를 사용했습니다.':''}`)}
function editPhoto(id){activePhoto=id;let p=photos.find(x=>x.id===id);modal('사진의 순간',`<img class="preview" src="${photoURL(p)}"><form id="editor" class="form" onsubmit="savePhoto(event,'${id}')"><label>촬영 날짜 및 시간</label><input type="datetime-local" name="datetime" required value="${esc(p.datetime)}"><label>장소</label><input name="place" value="${esc(p.place)}" placeholder="예: 테카포 호수"><div class="muted">${p.lat!=null?'📍 사진 GPS: '+p.lat.toFixed(5)+', '+p.lon.toFixed(5):'📍 사진에 GPS가 없어요.'}</div>${p.lat!=null?`<button class="ghost" type="button" onclick="lookupPlace('${id}')">GPS로 지명 찾아보기 (인터넷 필요)</button>`:''}<label>사진 메모</label><textarea name="caption" placeholder="이 순간의 기억">${esc(p.caption)}</textarea><div class="actions"><button type="submit" class="primary">저장</button><button type="button" class="ghost" onclick="setCover('${id}')">표지로 설정</button><button type="button" class="ghost danger" onclick="deletePhoto('${id}')">사진 삭제</button></div></form>`)}async function lookupPlace(id){let p=photos.find(x=>x.id===id);if(p.lat==null)return;try{let r=await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${p.lat}&lon=${p.lon}&format=json&zoom=16&accept-language=ko`);if(!r.ok)throw 0;let x=await r.json();$('#editor [name=place]').value=x.name||x.address?.tourism||x.address?.suburb||x.address?.town||x.address?.city||x.display_name?.split(',')[0]||''}catch{alert('지명을 가져오지 못했어요. 직접 입력해 주세요.')}}async function savePhoto(ev,id){ev.preventDefault();await put('photos',{...photos.find(x=>x.id===id),...formData()});closeModal();await reload()}async function setCover(id){await put('trips',{...trip(),coverId:id});closeModal();await reload()}async function deletePhoto(id){if(!confirm('이 사진을 삭제할까요?'))return;await del('photos',id);clearUrl(id);closeModal();await reload()}
function newNote(){noteForm()}function editNote(id){noteForm(notes.find(x=>x.id===id))}function noteForm(n={}){modal(n.id?'여행 메모 수정':'여행 메모',`<form id="editor" class="form" onsubmit="saveNote(event,'${n.id||''}')"><label>날짜</label><input type="date" name="date" required value="${n.date||today()}"><label>장소 또는 제목</label><input name="place" placeholder="예: 노을을 보던 저녁" value="${esc(n.place||'')}"><label>기억하고 싶은 이야기</label><textarea name="text" required rows="6" placeholder="어디에 있었는지, 누구와 어떤 기분이었는지...">${esc(n.text||'')}</textarea><div class="actions"><button class="primary">저장</button>${n.id?`<button class="ghost danger" type="button" onclick="deleteNote('${n.id}')">삭제</button>`:''}</div></form>`)}async function saveNote(ev,id){ev.preventDefault();await put('notes',{...notes.find(x=>x.id===id),...formData(),id:id||uid(),tripId:selected});closeModal();await reload()}async function deleteNote(id){if(!confirm('메모를 삭제할까요?'))return;await del('notes',id);closeModal();await reload()}
function expenseForm(e={}){const t=trip();modal(e.id?'지출 수정':'여행 지출',`<form class="form" id="editor" onsubmit="saveExpense(event,'${e.id||''}')"><label>날짜</label><input type="date" name="date" required value="${e.date||today()}"><label>장소 / 가게명</label><input name="place" placeholder="예: Countdown 마트" value="${esc(e.place||'')}"><div class="grid2"><div><label>금액 (${t.currency||'KRW'}) *</label><input type="number" step="0.01" min="0" inputmode="decimal" name="amount" required value="${e.amount||''}"></div><div><label>카테고리</label><select name="category">${['식비','교통','숙박','관광·입장료','쇼핑','장보기','기타'].map(c=>`<option ${e.category===c?'selected':''}>${c}</option>`).join('')}</select></div></div><label>상세 내용</label><textarea name="detail" placeholder="구매한 물건, 인원, 결제 수단 등">${esc(e.detail||'')}</textarea><div class="actions"><button class="primary">저장</button>${e.id?`<button type="button" class="ghost danger" onclick="deleteExpense('${e.id}')">삭제</button>`:''}</div></form>`)}function newExpense(){expenseForm()}function editExpense(id){expenseForm(expenses.find(x=>x.id===id))}async function saveExpense(ev,id){ev.preventDefault();await put('expenses',{...expenses.find(x=>x.id===id),...formData(),id:id||uid(),tripId:selected});closeModal();await reload()}async function deleteExpense(id){if(!confirm('지출을 삭제할까요?'))return;await del('expenses',id);closeModal();await reload()}
async function onReceipt(file){if(!file)return;expenseForm({date:today()});let form=$('#editor');form.insertAdjacentHTML('afterbegin','<div class="notice" id="ocrStatus">영수증 문자 인식 준비 중... 인터넷이 필요해요.</div>');try{if(!window.Tesseract)await loadScript('https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js');$('#ocrStatus').textContent='영수증 인식 중...';let w=await Tesseract.createWorker('kor+eng');let result=await w.recognize(file);await w.terminate();let lines=result.data.text.split(/\n/).map(x=>x.trim()).filter(Boolean);let candidates=lines.map(s=>({line:s,numbers:[...s.matchAll(/(?:\d{1,3}(?:[, .]\d{3})+|\d{3,})(?:\.\d{1,2})?/g)].map(m=>Number(m[0].replace(/[, ]/g,'')))}));let prioritized=candidates.filter(x=>/합계|총액|결제금액|TOTAL|AMOUNT|TO PAY|BALANCE|합계금액/i.test(x.line)).flatMap(x=>x.numbers);let amounts=(prioritized.length?prioritized:candidates.flatMap(x=>x.numbers)).filter(n=>n>0&&n<1e9);let amount=amounts.length?Math.max(...amounts):'';let name=lines.find(x=>/[가-힣A-Za-z]{2}/.test(x)&&!/영수증|receipt|사업자|전화|주소|일시|번호|tax|total|amount/i.test(x))||'';form.elements.place.value=name.slice(0,60);form.elements.amount.value=amount;$('#ocrStatus').textContent='인식 결과를 임시 입력했어요. 가게명과 금액을 꼭 확인하고 저장해주세요.'}catch(e){$('#ocrStatus').textContent='자동 인식에 실패했어요. 아래에서 직접 입력해주세요. ('+esc(e.message||'연결 오류')+')'}$('#receiptFile').value=''}
function download(blob,name){const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),60000)}function exportCSV(){let t=trip(),rows=[['날짜','장소','카테고리','금액','통화','상세'],...listExpenses().map(e=>[e.date,e.place,e.category,e.amount,t.currency,e.detail])];let s='\ufeff'+rows.map(r=>r.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');download(new Blob([s],{type:'text/csv;charset=utf-8'}),`${t.title}_경비.csv`)}
async function blobDataURL(b){return new Promise((res,rej)=>{let r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(b)})}
async function exportBook(){let t=trip(),pp=listPhoto(),nn=listNotes(),ee=listExpenses();let btn=event?.target;if(btn)btn.disabled=true;try{let imgs={};for(let p of pp)imgs[p.id]=await blobDataURL(p.blob);let dates=[...new Set([...pp.map(x=>x.datetime.slice(0,10)),...nn.map(x=>x.date)])].sort();let html=`<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(t.title)}</title><style>body{font-family:system-ui,sans-serif;max-width:760px;margin:auto;padding:28px;color:#34463f;background:#faf9f4}h1{font:42px Georgia,serif}h2{border-bottom:1px solid #cadbd2;padding-bottom:10px}.photos{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.photos img{width:100%;border-radius:12px}.photo{break-inside:avoid}.cap{font-size:12px;color:#789084;margin:6px 0 18px}.note{padding:15px;background:#edf3ed;border-radius:12px;white-space:pre-wrap;margin:14px 0}header{min-height:220px;background:#e3eee6;padding:30px;border-radius:20px}small{color:#7e9185}@media print{body{padding:0}h2{break-before:page}}</style><header><small>MY TRAVEL MEMORIES</small><h1>${esc(t.title)}</h1><p>${esc(t.destination)} · ${esc(t.start)} ~ ${esc(t.end)}</p><p>${esc(t.intro)}</p></header>${dates.map(d=>`<section><h2>${esc(dateLabel(d))}</h2><div class="photos">${pp.filter(p=>p.datetime.startsWith(d)).map(p=>`<div class="photo"><img src="${imgs[p.id]}"><div class="cap">${esc(p.datetime.slice(11,16))} ${esc(p.place)} ${esc(p.caption)}</div></div>`).join('')}</div>${nn.filter(n=>n.date===d).map(n=>`<div class="note"><b>${esc(n.place)}</b><p>${esc(n.text)}</p></div>`).join('')}</section>`).join('')}<footer><h2>여행 경비</h2><p>총 ${esc(money(ee.reduce((s,e)=>s+Number(e.amount||0),0),t.currency))}</p><small>the little journeys · 나의 여행기록</small></footer></html>`;download(new Blob([html],{type:'text/html;charset=utf-8'}),`${t.title}_여행책.html`)}catch(e){alert('여행책 저장 오류: '+e.message)}finally{if(btn)btn.disabled=false}}
function backupDialog(){modal('데이터 백업 · 복원',`<div class="notice">이 앱의 여행과 사진은 현재 브라우저에 저장됩니다. 휴대폰 변경·브라우저 데이터 삭제에 대비해 주기적으로 백업 파일을 보관하세요. 홈 화면 앱과 Safari는 저장 공간이 분리될 수도 있어요.</div><div class="actions"><button class="primary" onclick="backupAll()">↓ 전체 백업 파일 만들기</button><button class="secondary" onclick="$('#backupFile').click()">↑ 백업 가져오기</button></div><p class="muted">사진을 포함한 JSON 파일이라 용량이 커질 수 있어요. 가져오기는 기존 기록에 합쳐지고, 동일한 ID는 갱신됩니다.</p>`)}async function backupAll(){let btn=event?.target;if(btn)btn.disabled=true;try{let data={version:1,exported:new Date().toISOString(),trips,expenses,notes,photos:[]};for(let p of photos){let {blob,...rest}=p;data.photos.push({...rest,dataURL:await blobDataURL(blob)})}download(new Blob([JSON.stringify(data)],{type:'application/json'}),'travel-memo-backup-'+today()+'.json')}catch(e){alert('백업 실패: '+e.message)}finally{if(btn)btn.disabled=false}}
function dataURLBlob(s){let [info,data]=s.split(','),type=info.match(/data:(.*?);/)?.[1]||'image/jpeg',bin=atob(data),ar=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)ar[i]=bin.charCodeAt(i);return new Blob([ar],{type})}async function restore(file){if(!file)return;try{let data=JSON.parse(await file.text());if(data.version!==1||!Array.isArray(data.trips)||!Array.isArray(data.photos))throw new Error('지원하지 않는 백업 파일');if(!confirm(`여행 ${data.trips.length}개, 사진 ${data.photos.length}장을 가져올까요?`))return;for(let t of data.trips)await put('trips',t);for(let x of data.expenses||[])await put('expenses',x);for(let x of data.notes||[])await put('notes',x);for(let p of data.photos){let{dataURL,...rest}=p;clearUrl(p.id);await put('photos',{...rest,blob:dataURLBlob(dataURL)})}closeModal();await reload();alert('복원이 완료됐어요.')}catch(e){alert('복원 실패: '+e.message)}finally{$('#backupFile').value=''}}
$('#backupOpen').onclick=backupDialog;$('#photosFile').onchange=e=>onPhotos([...e.target.files]);$('#receiptFile').onchange=e=>onReceipt(e.target.files[0]);$('#backupFile').onchange=e=>restore(e.target.files[0]);openDB().then(async x=>{db=x;await reload()}).catch(async e=>{console.warn('IndexedDB failed, trying localStorage',e);try{localStorage.setItem(localPrefix+'test','ok');localStorage.removeItem(localPrefix+'test');localMode=true;await reload();const warning=document.createElement('div');warning.className='notice';warning.textContent='간편 저장 모드로 실행 중입니다. 사진이 많으면 저장 공간이 부족할 수 있으니 GitHub Pages에서 열고 백업을 자주 해주세요.';$('#app').prepend(warning)}catch(err){console.error(err);$('#app').innerHTML='<div class="notice"><h2>저장 공간 접근이 차단됐어요</h2><p>아이폰 파일 미리보기에서는 동작하지 않을 수 있어요. GitHub Pages로 배포한 주소를 Safari에서 열어주세요.</p></div>'}});
</script></body></html>
